name: voice_anim_kit
description: >
  A collection of beautiful, customizable recording & voice animation widgets
  for Flutter. 9 premium styles — Wave, Bar, Circle, Blob, Line, Particle,
  Ripple, AI Gaze, and Glow Bar — all driven by a simple amplitude value.
version: 0.3.0
homepage: https://github.com/BrotherPeng/voice_anim_kit
repository: https://github.com/BrotherPeng/voice_anim_kit
issue_tracker: https://github.com/BrotherPeng/voice_anim_kit/issues
topics:
  - animation
  - audio
  - recording
  - visualizer
  - widget

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Capture formatter patch for diagnosis
        if: failure()
        run: |
          dart format .
          git diff --binary > /tmp/dart-format.patch

      - name: Upload formatter patch
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dart-format-patch
          path: /tmp/dart-format.patch
          if-no-files-found: error

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run focused regression tests
        run: >-
          flutter test
          test/local_playlist_manager_test.dart
          test/artwork_palette_service_test.dart
          test/library_display_settings_test.dart
          test/playback_policies_test.dart
          test/playback_state_store_test.dart
          test/track_content_transition_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Validate Android debug build
        run: flutter build apk --debug --target-platform android-arm64

name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install Android native build dependencies
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2; exit 127; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust for Lactea
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Lactea C API and fetch real MilkDrop presets
        run: scripts/build_lactea_android.sh

      - name: Verify Lactea native payload
        run: python tool/validate_lactea_payload.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run source guardrails
        run: |
          python tool/validate_foundation.py
          python tool/validate_library_evolution_v1.py
          python tool/validate_pi_source_fixes.py
          python tool/validate_pi_v1_2.py
          python tool/validate_v5_performance.py
          python tool/validate_v6_ui_performance.py
          python tool/validate_playback_selection_fixes.py

      - name: Normalize Dart formatting
        run: dart format .

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build Android profile APK
        run: flutter build apk --profile --target-platform android-arm64

      - name: Verify Lactea payload inside both APKs
        run: |
          python tool/validate_lactea_apk.py build/app/outputs/flutter-apk/app-debug.apk
          python tool/validate_lactea_apk.py build/app/outputs/flutter-apk/app-profile.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: yazen-player-android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error

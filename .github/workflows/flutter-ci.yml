name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run source guardrails
        run: |
          python tool/validate_foundation.py
          python tool/validate_library_evolution_v1.py
          python tool/validate_pi_source_fixes.py
          python tool/validate_pi_v1_2.py
          python tool/validate_v5_performance.py
          python tool/validate_v6_ui_performance.py
          python tool/validate_playback_selection_fixes.py

      - name: Normalize Dart formatting
        run: dart format .

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build Android profile APK
        run: flutter build apk --profile --target-platform android-arm64

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: yazen-player-android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error

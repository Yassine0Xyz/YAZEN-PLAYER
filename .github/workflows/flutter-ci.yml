name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/temp-performance-v1
  pull_request:
    branches:
      - diagnostics/temp-performance-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Validate temporary diagnostics wiring
        run: python3 tool/validate_temp_diagnostics.py

      - name: Validate PI source fixes
        run: python3 tool/validate_pi_source_fixes.py

      - name: Validate PI v1.2 guardrails
        run: python3 tool/validate_pi_v1_2.py

      - name: Validate V5 performance guardrails
        run: python3 tool/validate_v5_performance.py

      - name: Validate V6 UI performance guardrails
        run: python3 tool/validate_v6_ui_performance.py

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android profile APK
        run: flutter build apk --profile --target-platform android-arm64

      - name: Upload Android profile APK
        uses: actions/upload-artifact@v4
        with:
          name: yazen-player-profile-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error

      - name: Build Android release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: yazen-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
